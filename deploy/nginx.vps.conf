# Nginx în față la API + Next (aceeași gazdă).
# client_max_body_size — încărcări PDF BAC (max 30 MB fișier, base64 în JSON ~42 MB).

upstream next_upstream {
    server frontend:3000;
}

upstream api_upstream {
    server backend:4000;
}

server {
    listen 80;
    listen [::]:80;

    server_name zecelainfo.ro www.zecelainfo.ro;

    client_max_body_size 45m;

    # ACME HTTP-01 validation, shared with host Certbot through the existing mount.
    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # www e doar oglinda istorică a domeniului; SEO vrea o singură gazdă canonică (non-www),
    # altfel Google poate indexa ambele variante ca pagini duplicate.
    server_name www.zecelainfo.ro;

    ssl_certificate /etc/letsencrypt/live/zecelainfo.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zecelainfo.ro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://zecelainfo.ro$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name zecelainfo.ro;

    client_max_body_size 45m;

    ssl_certificate /etc/letsencrypt/live/zecelainfo.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zecelainfo.ro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Necesare pentru upgrade la WebSocket (terminalul interactiv al compilatorului).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # OpenAI pe grila poate dura >60s; evita 504 Gateway Timeout.
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # PDF-uri BAC încărcate la runtime — Next.js în producție nu servește fișiere noi din public/.
    location /uploads/bac-submissions/ {
        alias /var/www/bac-uploads/;
        default_type application/pdf;
        add_header Cache-Control "private, max-age=3600";
    }

    location /uploads/bac-subjects/ {
        alias /var/www/bac-subjects/;
        default_type application/pdf;
        add_header Cache-Control "public, max-age=86400";
    }

    location /uploads/grile-questions/ {
        alias /var/www/grile-question-images/;
        add_header Cache-Control "private, max-age=3600";
    }

    location /uploads/bac-exam/ {
        alias /var/www/bac-exam-images/;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://next_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
