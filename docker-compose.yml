version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zecelainfo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  judge:
    build: ./judge
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:password@postgres:5432/zecelainfo
      JUDGE_SECRET: secret_local
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
      - SYS_CHROOT
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./judge:/app

volumes:
  postgres_data:
  redis_data:
